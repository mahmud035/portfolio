<html lang="en" class="scroll-smooth">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Md. Mahamudul Hasan Pavel — Full-Stack Developer</title>
    <meta
      name="description"
      content="AI-native full-stack MERN developer with 2+ years building production-grade, type-safe web applications in React, TypeScript, Node, and MongoDB."
    />
    <meta name="author" content="Md. Mahamudul Hasan Pavel" />
    <meta
      name="google-site-verification"
      content="ysexw4cMXWI4SjNFa8vXbaKatNweeZfANPJO_dmkneo"
    />

    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Preload the LCP headshot so it starts downloading before the JS bundle runs. Keep in sync with Hero/profile. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/mahmud-640.webp"
      imagesrcset="/mahmud-320.webp 320w, /mahmud-480.webp 480w, /mahmud-640.webp 640w"
      imagesizes="(min-width: 768px) 320px, (min-width: 640px) 288px, 224px"
      fetchpriority="high"
    />

    <!-- Structured data: ties this site to the same person across profiles -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Md. Mahamudul Hasan Pavel",
        "alternateName": ["Mahamudul Hasan Pavel", "Mahamudul Hasan"],
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/mahmud.png",
        "jobTitle": "Full-Stack Developer",
        "sameAs": [
          "https://www.linkedin.com/in/mahmud035/",
          "https://github.com/mahmud035",
          "https://x.com/mahmud_035"
        ]
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Md. Mahamudul Hasan Pavel" />
    <meta
      property="og:title"
      content="Md. Mahamudul Hasan Pavel — Full-Stack Developer"
    />
    <meta
      property="og:description"
      content="AI-native full-stack MERN developer with 2+ years building production-grade, type-safe web applications in React, TypeScript, Node, and MongoDB."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Md. Mahamudul Hasan Pavel — Full-Stack Developer"
    />
    <meta
      name="twitter:description"
      content="AI-native full-stack MERN developer with 2+ years building production-grade, type-safe web applications in React, TypeScript, Node, and MongoDB."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!--
      No-flash theme init: runs before React hydrates so the correct theme
      class is on <html> for the very first paint. Mirrors ThemeProvider logic.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          // Default dark: only fall back to light when the OS *explicitly*
          // prefers light. No stored value + no OS preference => dark.
          var prefersLight = window.matchMedia(
            '(prefers-color-scheme: light)',
          ).matches;
          var isDark = stored ? stored === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
